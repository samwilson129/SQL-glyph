name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r sql-engine/requirements.txt -r sql-engine/requirements-dev.txt

      - name: Type check
        run: npm run typecheck

      - name: Run test suites
        run: npm test

      - name: Measure coverage
        run: npm run test:coverage

      - name: Package VS Code extension
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: sql-glyph-${{ github.sha }}
          path: sql-glyph-0.2.0.vsix
          if-no-files-found: error
          retention-days: 14
